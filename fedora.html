<!DOCTYPE html>
<html lang="en">
<head>
  <title>Fedora</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="" />
</head>
<body>
  <h1>Network</h1>
  <h2>Enum</h2>
  <ul>
      <li>]# nmcli d</li>
      <li>]# nmcli d show [interfaceID]</li>
      <li>]# ip addr show</li>
  </ul>
  <h2>DNS</h2>
  <ul>
    <li>]# vi /etc/resolv.conf</li>
    ]# nmcli c modify &lt;interfaceID&gt; ipv4.addresses "[nameserverIP] [gatewayIP]"
  </ul>
  <h2>tcpdump</h2>
  <ul>
    <li>]# tcpdump -nni &lt;interfaceID&gt; tcp and port 80</li>
  </ul>
</body>
</html>
