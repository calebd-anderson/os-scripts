  <h2>Copy in Vim (yank)</h2>
  <div>
    <code>yy</code>
  </div>
  <h2>delete from cursor to end of line</h2>
  <div>
    <code>d$</code>
  </div>

  <div>
    <code>d0</code>
  </div>
